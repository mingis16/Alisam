<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Standard Guest House exterior on College Road, Freetown</title>
  <desc id="desc">Illustrated two-story guest house building with a covered veranda, palm trees, and a warm evening sky over College Road, Freetown, Sierra Leone.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6c98a"/>
      <stop offset="45%" stop-color="#e8935f"/>
      <stop offset="100%" stop-color="#547746"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3ede0"/>
      <stop offset="100%" stop-color="#d3ba90"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect y="620" width="1600" height="280" fill="#33482a"/>
  <g opacity="0.9">
    <ellipse cx="200" cy="640" rx="220" ry="40" fill="#22301d"/>
    <ellipse cx="1400" cy="650" rx="260" ry="45" fill="#22301d"/>
  </g>
  <!-- Palm trees -->
  <g fill="#293a22">
    <rect x="90" y="420" width="18" height="220" rx="6"/>
    <path d="M99 420 C 40 380, 20 340, 40 300 C 70 340, 90 380, 99 420 Z"/>
    <path d="M99 420 C 160 380, 190 350, 180 300 C 140 330, 105 380, 99 420 Z"/>
    <path d="M99 420 C 60 400, 20 420, 10 460 C 55 450, 85 435, 99 420 Z"/>
    <path d="M99 420 C 140 400, 180 415, 195 450 C 150 445, 115 432, 99 420 Z"/>
  </g>
  <g fill="#293a22">
    <rect x="1480" y="440" width="16" height="200" rx="6"/>
    <path d="M1488 440 C 1440 400, 1425 365, 1440 330 C 1465 365, 1483 400, 1488 440 Z"/>
    <path d="M1488 440 C 1540 400, 1560 375, 1550 335 C 1515 360, 1493 400, 1488 440 Z"/>
  </g>
  <!-- Building -->
  <rect x="380" y="300" width="840" height="340" fill="url(#wall)" stroke="#4f382a" stroke-width="4"/>
  <rect x="380" y="290" width="840" height="26" fill="#6d4e30"/>
  <!-- Roof -->
  <polygon points="350,300 800,150 1250,300" fill="#3f5c34" stroke="#22301d" stroke-width="4"/>
  <!-- Veranda -->
  <rect x="420" y="520" width="760" height="120" fill="#e5d7bd" stroke="#4f382a" stroke-width="3"/>
  <g stroke="#8a643a" stroke-width="10">
    <line x1="460" y1="520" x2="460" y2="640"/>
    <line x1="600" y1="520" x2="600" y2="640"/>
    <line x1="740" y1="520" x2="740" y2="640"/>
    <line x1="880" y1="520" x2="880" y2="640"/>
    <line x1="1020" y1="520" x2="1020" y2="640"/>
    <line x1="1160" y1="520" x2="1160" y2="640"/>
  </g>
  <!-- Windows with warm interior light -->
  <g stroke="#4f382a" stroke-width="4">
    <rect x="440" y="340" width="120" height="130" fill="#fbe6a8"/>
    <rect x="620" y="340" width="120" height="130" fill="#f6c98a"/>
    <rect x="860" y="340" width="120" height="130" fill="#fbe6a8"/>
    <rect x="1040" y="340" width="120" height="130" fill="#f6c98a"/>
  </g>
  <!-- Door -->
  <rect x="750" y="540" width="100" height="100" fill="#4f382a"/>
  <!-- Signage -->
  <rect x="620" y="470" width="360" height="60" rx="8" fill="#101a0d" opacity="0.85"/>
  <text x="800" y="509" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#f4f7f3">Standard Guest House</text>
</svg>
