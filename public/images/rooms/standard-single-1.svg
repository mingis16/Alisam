<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
  <title id="t">Standard Single Room at Standard Guest House</title>
  <desc id="d">Air-conditioned single guest room with a mosquito net canopy over the bed, wall-mounted TV, fitted wardrobe, and tiled flooring.</desc>
  <rect width="1200" height="800" fill="#f7f4ef"/>
  <rect width="1200" height="520" fill="#e2ebde"/>
  <!-- tile floor -->
  <g stroke="#d3ba90" stroke-width="2">
    <rect x="0" y="520" width="1200" height="280" fill="#f3ede0"/>
    <line x1="0" y1="580" x2="1200" y2="580"/><line x1="0" y1="640" x2="1200" y2="640"/><line x1="0" y1="700" x2="1200" y2="700"/><line x1="0" y1="760" x2="1200" y2="760"/>
    <line x1="150" y1="520" x2="150" y2="800"/><line x1="300" y1="520" x2="300" y2="800"/><line x1="450" y1="520" x2="450" y2="800"/><line x1="600" y1="520" x2="600" y2="800"/><line x1="750" y1="520" x2="750" y2="800"/><line x1="900" y1="520" x2="900" y2="800"/><line x1="1050" y1="520" x2="1050" y2="800"/>
  </g>
  <!-- window with drapery -->
  <rect x="60" y="80" width="220" height="260" fill="#cfe3f2" stroke="#4f382a" stroke-width="6"/>
  <line x1="170" y1="80" x2="170" y2="340" stroke="#4f382a" stroke-width="4"/>
  <line x1="60" y1="210" x2="280" y2="210" stroke="#4f382a" stroke-width="4"/>
  <path d="M55 70 C 30 150, 30 260, 55 345 L 85 345 C 65 260, 65 150, 85 70 Z" fill="#a97f47" opacity="0.85"/>
  <path d="M285 70 C 310 150, 310 260, 285 345 L 255 345 C 275 260, 275 150, 255 70 Z" fill="#a97f47" opacity="0.85"/>
  <!-- wall TV -->
  <rect x="950" y="120" width="190" height="115" rx="4" fill="#101a0d"/>
  <rect x="962" y="132" width="166" height="91" fill="#3f5c34"/>
  <!-- AC unit -->
  <rect x="420" y="70" width="220" height="46" rx="6" fill="#ffffff" stroke="#c3d6bb" stroke-width="3"/>
  <line x1="440" y1="93" x2="620" y2="93" stroke="#9cbb8e" stroke-width="4"/>
  <!-- bed with mosquito net canopy -->
  <g>
    <path d="M470 250 L730 250 L780 470 L420 470 Z" fill="#ffffff" opacity="0.55" stroke="#9cbb8e" stroke-width="2"/>
    <circle cx="600" cy="245" r="14" fill="#9cbb8e"/>
    <rect x="380" y="470" width="440" height="150" rx="10" fill="#547746"/>
    <rect x="400" y="440" width="400" height="50" rx="10" fill="#ffffff" stroke="#e2ebde" stroke-width="2"/>
    <rect x="420" y="410" width="120" height="45" rx="10" fill="#ffffff" stroke="#e2ebde" stroke-width="2"/>
    <rect x="380" y="600" width="440" height="90" rx="8" fill="#3f5c34"/>
  </g>
  <!-- wardrobe -->
  <rect x="850" y="330" width="230" height="290" fill="#e5d7bd" stroke="#4f382a" stroke-width="4"/>
  <line x1="965" y1="330" x2="965" y2="620" stroke="#4f382a" stroke-width="3"/>
  <circle cx="945" cy="470" r="6" fill="#4f382a"/><circle cx="985" cy="470" r="6" fill="#4f382a"/>
  <!-- desk + chair -->
  <rect x="70" y="470" width="230" height="18" fill="#8a643a"/>
  <rect x="80" y="488" width="14" height="120" fill="#6d4e30"/>
  <rect x="276" y="488" width="14" height="120" fill="#6d4e30"/>
  <rect x="120" y="560" width="70" height="70" fill="#547746"/>
  <rect x="900" y="700" width="60" height="14" fill="#4f382a" opacity="0"/>
  <rect x="20" y="20" width="360" height="46" rx="8" fill="#101a0d" opacity="0.8"/>
  <text x="200" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#f4f7f3">Standard Single Room</text>
</svg>
