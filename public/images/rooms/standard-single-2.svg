<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
  <title id="t">En-suite bathroom in the Standard Single Room</title>
  <desc id="d">Private en-suite bathroom with tile flooring and wall tiling attached to the Standard Single Room at Standard Guest House.</desc>
  <rect width="1200" height="800" fill="#eaf1e6"/>
  <rect width="1200" height="420" fill="#dcebe0"/>
  <g stroke="#c3d6bb" stroke-width="2">
    <rect x="0" y="420" width="1200" height="380" fill="#f4f7f3"/>
    <line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="540" x2="1200" y2="540"/><line x1="0" y1="600" x2="1200" y2="600"/><line x1="0" y1="660" x2="1200" y2="660"/><line x1="0" y1="720" x2="1200" y2="720"/>
    <line x1="200" y1="420" x2="200" y2="800"/><line x1="400" y1="420" x2="400" y2="800"/><line x1="600" y1="420" x2="600" y2="800"/><line x1="800" y1="420" x2="800" y2="800"/><line x1="1000" y1="420" x2="1000" y2="800"/>
  </g>
  <g stroke="#a9c79f" stroke-width="2">
    <line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="420"/><line x1="300" y1="0" x2="300" y2="420"/><line x1="450" y1="0" x2="450" y2="420"/><line x1="600" y1="0" x2="600" y2="420"/><line x1="750" y1="0" x2="750" y2="420"/><line x1="900" y1="0" x2="900" y2="420"/><line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>
  <!-- shower enclosure -->
  <rect x="820" y="60" width="320" height="360" fill="#d7ecf5" opacity="0.6" stroke="#547746" stroke-width="4"/>
  <circle cx="980" cy="110" r="16" fill="#8a643a"/>
  <line x1="980" y1="126" x2="980" y2="170" stroke="#8a643a" stroke-width="8"/>
  <!-- vanity + sink -->
  <rect x="120" y="300" width="320" height="30" fill="#e5d7bd" stroke="#4f382a" stroke-width="3"/>
  <ellipse cx="220" cy="300" rx="70" ry="22" fill="#ffffff" stroke="#4f382a" stroke-width="3"/>
  <rect x="200" y="230" width="40" height="70" fill="#c3d6bb"/>
  <rect x="120" y="330" width="320" height="90" fill="#f3ede0" stroke="#4f382a" stroke-width="3"/>
  <!-- mirror -->
  <rect x="150" y="120" width="140" height="100" rx="6" fill="#cfe3f2" stroke="#4f382a" stroke-width="4"/>
  <!-- toilet -->
  <rect x="520" y="330" width="90" height="20" fill="#ffffff" stroke="#4f382a" stroke-width="3"/>
  <ellipse cx="565" cy="390" rx="55" ry="45" fill="#ffffff" stroke="#4f382a" stroke-width="3"/>
  <rect x="20" y="20" width="420" height="46" rx="8" fill="#101a0d" opacity="0.8"/>
  <text x="230" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#f4f7f3">En-suite Bathroom — Tile Flooring</text>
</svg>
